name: Lady Jane WhatsApp Gateway 24/7

on:
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    # Auto-refresh run every 5 hours (GitHub Action maximum job limit is 6h)
    - cron: '0 */5 * * *'

concurrency:
  group: lady-jane-gateway
  cancel-in-progress: true

jobs:
  run-gateway:
    name: Run Lady Jane in GitHub Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 340 # 5 hours 40 minutes

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: gateway/package.json

      - name: Install Gateway Dependencies
        run: |
          cd gateway
          npm ci --omit=dev

      - name: Start Lady Jane Gateway
        env:
          BRAIN_URL: ${{ secrets.BRAIN_URL }}
          GATEWAY_TOKEN: ${{ secrets.GATEWAY_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_LEVEL: info
        run: |
          date +%s > /tmp/runner_start_epoch
          cd gateway
          echo "👑 Starting Lady Jane Gateway in GitHub Cloud..."
          node src/index.js

      - name: Auto-Relay to Next Runner (24/7 Continuous Loop)
        if: '!cancelled()'
        run: |
          START=$(cat /tmp/runner_start_epoch 2>/dev/null || echo 0)
          NOW=$(date +%s)
          DIFF=$((NOW - START))
          echo "Runner ran for $DIFF seconds."
          # Only trigger relay if runner ran for at least 60 seconds (prevents crash loops)
          if [ "$DIFF" -ge 60 ]; then
            echo "🔄 Dispatching next 24/7 relay runner..."
            sleep 3
            curl -s -X POST \
              -H "Authorization: token ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/gateway.yml/dispatches \
              -d '{"ref":"main"}' || true
            echo "✅ Relay request sent."
          else
            echo "⚠️ Runner terminated too quickly ($DIFF s). Skipping auto-relay to prevent infinite crash loop."
          fi

